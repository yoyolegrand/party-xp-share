modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/yoyolegrand/party-xp-share/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="partyxpshare_logo.png"
displayURL="https://github.com/yoyolegrand/party-xp-share"
authors="${mod_authors}"
# Server-side only: players without the mod can still join.
displayTest="IGNORE_ALL_VERSION"
description='''
Share mob XP with everyone who helped kill it.

- DAMAGE: XP split by the share of damage each player dealt.
- EQUAL: XP split evenly between every participant.
- HYBRID: a bonus for the killer, the rest split by damage.
- Optional orb sharing: picked-up XP orbs are shared with nearby players.
- Minimum contribution, share radius, group bonus, pets, mob filters, Mending support.
- Edit everything in config/partyxpshare-common.toml or in game with /partyxp.
- Built-in compatibility with Wave Survivor hordes.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="wavesurvivor"
    mandatory=false
    versionRange="[2.0,)"
    ordering="NONE"
    side="SERVER"
